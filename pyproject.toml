[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-ops-parser"
version = "0.1.0"
description = "Convert invoices and shipping PDFs into Excel, CSV and JSON"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Aqiao", email = "aqiao@fairy-tail.dev"},
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial",
    "Topic :: Text Processing",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "typer>=0.12.0",
    "pdfplumber>=0.11.0",
    "PyMuPDF>=1.24.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3.0",
    "fpdf2>=2.7.0",
]

[project.scripts]
pdfops = "cli.main:app"

[tool.setuptools.packages.find]
include = [
    "packages*",
    "cli*",
    "apps*",
]
