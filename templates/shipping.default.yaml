# Shipping Label Default Template

fields:
  tracking_number:
    patterns:
      - "(?i)tracking\\s*(#|number|no|id)?:?\\s*(\\S+)"
    group: 2

  carrier:
    patterns:
      - "(?i)carrier:?\\s*(.+)"
      - "(?i)(fedex|ups|dhl|usps|sf\\s*express|ems)"

  sender_name:
    patterns:
      - "(?i)(?:from|sender|ship\\s+from):?\\s*(.+)"

  recipient_name:
    patterns:
      - "(?i)(?:to|recipient|ship\\s+to):?\\s*(.+)"

  weight:
    patterns:
      - "(?i)weight:?\\s*([\\d.]+)\\s*(kg|lb|g|oz)"

  estimated_delivery:
    patterns:
      - "(?i)(?:estimated|expected|delivery)\\s+date:?\\s*(\\d{4}[-/]\\d{2}[-/]\\d{2})"

events:
  line_pattern: "(\\d{4}[-/]\\d{2}[-/]\\d{2})\\s+(.+?)(?:\\s+-\\s+(.+))?"
  date_group: 1
  location_group: 2
  status_group: 3
